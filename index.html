<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD SYSTEM</title>

<style>
/* (UNCHANGED VISUALS — SAME AS YOUR WORKING VERSION) */

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: Arial;
  color: cyan;
  overflow: hidden;
  background: black;
}

#bgvid {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -5;
}

.video-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: -4;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: grid 6s linear infinite;
  z-index: -3;
}

@keyframes grid {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

#boot {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: boot 2.5s forwards;
}

@keyframes boot {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

.menu { display:flex; flex-direction:column; gap:12px; }

.menu-item {
  padding:12px;
  border:1px solid rgba(0,255,255,0.3);
  background:rgba(0,0,0,0.4);
  cursor:pointer;
}

.menu-item:hover {
  transform: translateX(5px);
  box-shadow: 0 0 15px cyan;
}

.center { position:relative; }

.page {
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:42px;
  opacity:0;
  transition:0.25s;
  pointer-events:none;
}

.page.active {
  opacity:1;
  pointer-events:all;
}

.panel { display:flex; flex-direction:column; gap:15px; }

.card {
  padding:15px;
  border:1px solid rgba(0,255,255,0.2);
  background:rgba(0,0,0,0.4);
}

.bar {
  height:10px;
  background:rgba(255,255,255,0.1);
  margin-top:8px;
}

.fill {
  height:100%;
  width:0%;
  background:cyan;
  transition:0.3s;
}

.visualizer {
  position: fixed;
  bottom: 100px;
  left: 20px;
  display: flex;
  gap: 3px;
  height: 80px;
  align-items: flex-end;
}

.vbar {
  width: 4px;
  height: 10px;
  background: cyan;
  box-shadow: 0 0 8px cyan;
}

.music {
  position: fixed;
  bottom: 15px;
  left: 15px;
  padding: 10px;
  border: 1px solid cyan;
  background: rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<video autoplay muted loop playsinline id="bgvid">
  <source src="bg.mp4">
</video>
<div class="video-overlay"></div>

<div id="boot">INITIALIZING SYSTEM CORE...</div>

<div class="container">

  <div class="menu">
    <div class="menu-item" onclick="showPage('dashboard')">DASHBOARD</div>
    <div class="menu-item" onclick="showPage('profile')">PROFILE</div>
    <div class="menu-item" onclick="showPage('system')">SYSTEM</div>
  </div>

  <div class="center">
    <div class="page active" id="dashboard">DASHBOARD ONLINE</div>
    <div class="page" id="profile">PROFILE MODULE</div>
    <div class="page" id="system">SYSTEM STATUS</div>
  </div>

  <div class="panel">
    <div class="card">CPU<div class="bar"><div class="fill" id="cpu"></div></div></div>
    <div class="card">MEMORY<div class="bar"><div class="fill" id="ram"></div></div></div>
    <div class="card">NETWORK<div class="bar"><div class="fill" id="net"></div></div></div>
  </div>

</div>

<div class="visualizer" id="vis"></div>

<audio id="bgm" loop>
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<div class="music">
  <button onclick="toggleMusic()">▶ / ⏸</button><br>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5">
</div>

<script>

/* PAGE SWITCH */
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* AUDIO */
const audio = document.getElementById("bgm");
const vol = document.getElementById("vol");

audio.volume = 0.5;
vol.oninput = () => audio.volume = vol.value;

function toggleMusic(){
  if(audio.paused) audio.play();
  else audio.pause();
}

/* SAFE AUDIO INIT (ONLY ONCE) */
let audioCtx, analyser, source, dataArray;
const vis = document.getElementById("vis");
const bars = [];

for(let i=0;i<40;i++){
  let b=document.createElement("div");
  b.className="vbar";
  vis.appendChild(b);
  bars.push(b);
}

function initAudio(){
  if(audioCtx) return; // 🔥 prevents breaking everything twice

  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser();

  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);

  analyser.fftSize = 64;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}

/* VISUALIZER */
function render(){
  requestAnimationFrame(render);

  if(!analyser) return;

  analyser.getByteFrequencyData(dataArray);

  bars.forEach((b,i)=>{
    b.style.height = (dataArray[i] / 255) * 80 + "px";
  });
}
render();

/* UNLOCK AUDIO */
document.addEventListener("click",()=>{
  initAudio();
  audio.play().catch(()=>{});
},{once:true});

/* SMOOTH STATS FIXED */
let cpu=0, ram=0, net=0;
let cpuT=50, ramT=50, netT=50;

setInterval(()=>{
  cpuT=Math.random()*100;
  ramT=Math.random()*100;
  netT=Math.random()*100;
},1000);

function animate(){
  cpu += (cpuT-cpu)*0.05;
  ram += (ramT-ram)*0.05;
  net += (netT-net)*0.05;

  document.getElementById("cpu").style.width = cpu + "%";
  document.getElementById("ram").style.width = ram + "%";
  document.getElementById("net").style.width = net + "%";

  requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
