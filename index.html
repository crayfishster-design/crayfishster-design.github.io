<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS RESTORED HUD</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Arial;
  color:cyan;
  overflow:hidden;
  background:black;
}

/* VIDEO BACKGROUND */
#bgvid{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-6;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  z-index:-5;
}

/* GRID */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size:40px 40px;
  animation:grid 6s linear infinite;
  z-index:-4;
}

@keyframes grid{
  from{transform:translateY(0);}
  to{transform:translateY(40px);}
}

/* BOOT INTRO */
#boot{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  color:cyan;
  animation:boot 2.8s forwards;
}

@keyframes boot{
  0%{opacity:1}
  80%{opacity:1}
  100%{opacity:0;visibility:hidden}
}

/* LAYOUT */
.container{
  display:grid;
  grid-template-columns:260px 1fr 320px;
  height:100vh;
  padding:20px;
  gap:20px;
}

/* MENU */
.menu{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.menu-item{
  padding:12px;
  border:1px solid rgba(0,255,255,0.3);
  background:rgba(0,0,0,0.4);
  cursor:pointer;
  transition:0.2s;
}

.menu-item:hover{
  transform:translateX(5px);
  box-shadow:0 0 15px cyan;
}

/* CENTER PAGES */
.center{
  position:relative;
}

.page{
  position:absolute;
  inset:0;
  opacity:0;
  transform:translateX(40px);
  pointer-events:none;
  transition:0.35s ease;
}

.page.active{
  opacity:1;
  transform:translateX(0);
  pointer-events:all;
}

/* DASHBOARD */
#dashboard{
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
}

/* PROFILE SPLIT UI */
.split{
  display:flex;
  width:100%;
  height:100%;
}

.split div{
  width:50%;
  position:relative;
  cursor:pointer;
  overflow:hidden;
  transition:0.3s;
}

.split div:hover{
  transform:scale(1.02);
  filter:brightness(1.2);
}

.split img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.split span{
  position:absolute;
  bottom:20px;
  left:20px;
  font-size:20px;
}

/* RIGHT PANEL */
.panel{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.card{
  padding:15px;
  border:1px solid rgba(0,255,255,0.2);
  background:rgba(0,0,0,0.4);
}

.bar{
  height:10px;
  background:rgba(255,255,255,0.1);
  margin-top:8px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:cyan;
  transition:width 0.6s ease;
}

/* BGM UI */
.bgm-ui{
  position:fixed;
  bottom:10px;
  left:10px;
  padding:10px;
  border:1px solid cyan;
  background:rgba(0,0,0,0.6);
  z-index:999;
}

/* VISUALIZER */
#visualizer{
  position:fixed;
  bottom:0;
  right:0;
  width:260px;
  height:100px;
  border:1px solid cyan;
  background:rgba(0,0,0,0.4);
  z-index:999;
}
</style>
</head>

<body>

<!-- 🎬 BOOT INTRO -->
<div id="boot">
  <h2>INITIALIZING SYSTEM...</h2>
  <p>loading modules...</p>
</div>

<!-- 🎥 BACKGROUND -->
<video autoplay muted loop playsinline id="bgvid">
  <source src="bg.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <div class="menu-item" onclick="switchPage('dashboard')">DASHBOARD</div>
    <div class="menu-item" onclick="switchPage('profile')">PROFILE</div>
    <div class="menu-item" onclick="switchPage('system')">SYSTEM</div>
  </div>

  <!-- CENTER PAGES -->
  <div class="center">

    <div class="page active" id="dashboard">
      SYSTEM ONLINE
    </div>

    <div class="page" id="profile">
      <div class="split">

        <div onclick="clickFX(); alert('UI A')" >
          <img src="https://images.unsplash.com/photo-1520975922284-9f0f2b0f8f7c">
          <span>UI SYSTEM A</span>
        </div>

        <div onclick="clickFX(); alert('UI B')" >
          <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5">
          <span>UI SYSTEM B</span>
        </div>

      </div>
    </div>

    <div class="page" id="system">
      SYSTEM STATUS ONLINE
    </div>

  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">
    <div class="card">CPU<div class="bar"><div class="fill" id="cpu"></div></div></div>
    <div class="card">RAM<div class="bar"><div class="fill" id="ram"></div></div></div>
    <div class="card">NET<div class="bar"><div class="fill" id="net"></div></div></div>
  </div>

</div>

<!-- 🎵 BGM -->
<div class="bgm-ui">
  🎵 AUDIO<br>
  <input type="range" id="vol" min="0" max="1" step="0.01">
  <br>
  <button onclick="toggleBGM()">Play / Pause</button>

 <audio id="bgm" loop>
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

</div>

<!-- 📊 VISUALIZER -->
<canvas id="visualizer"></canvas>

<script>

/* PAGE SYSTEM */
function switchPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* BOOT REMOVE */
setTimeout(()=>document.getElementById("boot").remove(),2800);

/* CLICK SOUND */
let ctx;
function clickFX(){
  if(!ctx) ctx = new AudioContext();
  const o = ctx.createOscillator();
  const g = ctx.createGain();

  o.type="square";
  o.frequency.value=600;

  g.gain.setValueAtTime(0.05,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);

  o.connect(g);
  g.connect(ctx.destination);

  o.start();
  o.stop(ctx.currentTime+0.08);
}

/* BGM */
const bgm = document.getElementById("bgm");
const vol = document.getElementById("vol");
bgm.volume = 0.5;

vol.oninput = ()=>bgm.volume = vol.value;

document.addEventListener("click",()=>bgm.play(),{once:true});

function toggleBGM(){
  if(bgm.paused) bgm.play();
  else bgm.pause();
}

/* SMOOTH BARS */
function lerp(a,b,t){return a+(b-a)*t;}
let cpu=0,ram=0,net=0;

setInterval(()=>{
  cpu=lerp(cpu,Math.random()*100,0.2);
  ram=lerp(ram,Math.random()*100,0.2);
  net=lerp(net,Math.random()*100,0.2);

  document.getElementById("cpu").style.width=cpu+"%";
  document.getElementById("ram").style.width=ram+"%";
  document.getElementById("net").style.width=net+"%";
},400);

/* VISUALIZER */
const canvas=document.getElementById("visualizer");
const c=canvas.getContext("2d");

canvas.width=260;
canvas.height=100;

const AudioCtx=window.AudioContext||window.webkitAudioContext;
const audioCtx=new AudioCtx();

const src=audioCtx.createMediaElementSource(bgm);
const analyser=audioCtx.createAnalyser();

src.connect(analyser);
analyser.connect(audioCtx.destination);

analyser.fftSize=64;

const data=new Uint8Array(analyser.frequencyBinCount);

function draw(){
  requestAnimationFrame(draw);

  analyser.getByteFrequencyData(data);

  c.clearRect(0,0,canvas.width,canvas.height);

  let w=canvas.width/data.length;

  for(let i=0;i<data.length;i++){
    let h=data[i]/2;
    c.fillStyle="cyan";
    c.fillRect(i*w,canvas.height-h,w-2,h);
  }
}

draw();

</script>

</body>
</html>
