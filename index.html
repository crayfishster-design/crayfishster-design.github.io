<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS UI</title>

<style>
/* ===== BACKGROUND ===== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url("https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3") center/cover no-repeat;
  color: #cfffff;
  overflow: hidden;
}

/* dark overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
}

/* ===== LAYOUT ===== */
.container {
  position: relative;
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  gap: 20px;
  padding: 20px;
}

/* ===== LEFT MENU ===== */
.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  padding: 12px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  cursor: pointer;
  transition: 0.2s;
}

.menu-item:hover {
  transform: translateX(5px);
  border-color: cyan;
  box-shadow: 0 0 15px cyan;
}

/* ===== CENTER PANEL ===== */
.center {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 20px;
}

.title {
  font-size: 48px;
  letter-spacing: 4px;
}

.subtitle {
  opacity: 0.7;
}

/* ===== RIGHT PANEL ===== */
.panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  padding: 15px;
  border: 1px solid rgba(0,255,255,0.2);
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
}

.bar {
  height: 8px;
  background: rgba(255,255,255,0.1);
  margin-top: 5px;
  overflow: hidden;
}

.fill {
  height: 100%;
  background: cyan;
}

/* glow */
.glow {
  color: cyan;
  text-shadow: 0 0 10px cyan;
}
</style>
</head>

<body>

<div class="container">

  <!-- LEFT MENU -->
  <div class="menu">
    <div class="menu-item">DASHBOARD</div>
    <div class="menu-item">PROFILE</div>
    <div class="menu-item">PROJECTS</div>
    <div class="menu-item">SETTINGS</div>
    <div class="menu-item">SYSTEM</div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="title glow">WELCOME</div>
    <div class="subtitle">Futuristic control interface prototype</div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">

    <div class="card">
      CPU USAGE
      <div class="bar"><div class="fill" style="width:70%"></div></div>
    </div>

    <div class="card">
      MEMORY
      <div class="bar"><div class="fill" style="width:50%"></div></div>
    </div>

    <div class="card">
      NETWORK
      <div class="bar"><div class="fill" style="width:80%"></div></div>
    </div>

  </div>

</div>

</body>
</html>
