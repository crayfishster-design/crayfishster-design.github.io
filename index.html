<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD SYSTEM</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial;
  color: cyan;
  overflow: hidden;
  background: black;
}

/* 🎥 VIDEO BACKGROUND */
#bgvid {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -5;
}

.video-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: -4;
}

/* GRID */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: grid 6s linear infinite;
  z-index: -3;
}

@keyframes grid {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

/* BOOT */
#boot {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: boot 2.5s forwards;
}

@keyframes boot {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* HUD */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

/* MENU */
.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  padding: 12px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.4);
  cursor: pointer;
  transition: 0.2s;
}

.menu-item:hover {
  transform: translateX(5px);
  box-shadow: 0 0 15px cyan;
}

/* CENTER */
.center {
  display: flex;
  justify-content: center;
  align-items: center;
}

.title {
  font-size: 42px;
  text-shadow: 0 0 10px cyan;
}

/* RIGHT PANEL */
.panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  padding: 15px;
  border: 1px solid rgba(0,255,255,0.2);
  background: rgba(0,0,0,0.4);
}

.bar {
  height: 10px;
  background: rgba(255,255,255,0.1);
  margin-top: 8px;
}

.fill {
  height: 100%;
  width: 0%;
  background: cyan;
}

/* =========================
   PROFILE SPLIT OVERLAY
========================= */
#profileUI {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 100;
}

.half {
  width: 50%;
  height: 100%;
  float: left;
  position: relative;
  cursor: pointer;
  overflow: hidden;
}

.half video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.half .label {
  position: absolute;
  bottom: 30px;
  left: 30px;
  font-size: 28px;
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* FULLSCREEN MODE AFTER CLICK */
.fullscreen {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 200;
}

.fullscreen video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.backBtn {
  position: absolute;
  top: 20px;
  left: 20px;
  padding: 10px;
  border: 1px solid cyan;
  background: rgba(0,0,0,0.6);
  cursor: pointer;
}

</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video autoplay muted loop id="bgvid">
  <source src="bg.mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<!-- BOOT -->
<div id="boot">INITIALIZING SYSTEM CORE...</div>

<!-- MAIN HUD -->
<div class="container">

  <!-- LEFT -->
  <div class="menu">
    <div class="menu-item">DASHBOARD</div>

    <!-- THIS IS THE ONLY CHANGED FUNCTION -->
    <div class="menu-item" onclick="openProfile()">PROFILE</div>

    <div class="menu-item">SYSTEM</div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="title">SYSTEM ONLINE</div>
  </div>

  <!-- RIGHT -->
  <div class="panel">

    <div class="card">
      CPU
      <div class="bar"><div class="fill" id="cpu"></div></div>
    </div>

    <div class="card">
      MEMORY
      <div class="bar"><div class="fill" id="ram"></div></div>
    </div>

    <div class="card">
      NETWORK
      <div class="bar"><div class="fill" id="net"></div></div>
    </div>

  </div>

</div>

<!-- PROFILE SPLIT UI -->
<div id="profileUI">

  <div class="half" onclick="openMode('A')">
    <video autoplay muted loop>
      <source src="modeA.mp4">
    </video>
    <div class="label">MODE A</div>
  </div>

  <div class="half" onclick="openMode('B')">
    <video autoplay muted loop>
      <source src="modeB.mp4">
    </video>
    <div class="label">MODE B</div>
  </div>

</div>

<!-- FULLSCREEN MODE A -->
<div id="modeA" class="fullscreen">
  <video autoplay muted loop>
    <source src="modeA.mp4">
  </video>
  <div class="backBtn" onclick="back()">BACK</div>
</div>

<!-- FULLSCREEN MODE B -->
<div id="modeB" class="fullscreen">
  <video autoplay muted loop>
    <source src="modeB.mp4">
  </video>
  <div class="backBtn" onclick="back()">BACK</div>
</div>

<script>

/* PROFILE OPEN */
function openProfile(){
  document.querySelector(".container").style.display = "none";
  document.getElementById("profileUI").style.display = "block";
}

/* OPEN MODE */
function openMode(m){
  document.getElementById("profileUI").style.display = "none";

  if(m === "A") document.getElementById("modeA").style.display = "block";
  if(m === "B") document.getElementById("modeB").style.display = "block";
}

/* BACK */
function back(){
  document.getElementById("modeA").style.display = "none";
  document.getElementById("modeB").style.display = "none";
  document.querySelector(".container").style.display = "grid";
}

/* FAKE STATS (SMOOTH) */
let cpu=0, ram=0, net=0;

setInterval(()=>{
  cpu += (Math.random()*100 - cpu)*0.1;
  ram += (Math.random()*100 - ram)*0.1;
  net += (Math.random()*100 - net)*0.1;

  document.getElementById("cpu").style.width = cpu + "%";
  document.getElementById("ram").style.width = ram + "%";
  document.getElementById("net").style.width = net + "%";
}, 500);

</script>

</body>
</html>
