<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS SYSTEM</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial;
  color: cyan;
  background: black;
  overflow: hidden;
}

/* ================= MAIN HUD ================= */

#hud {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 260px 1fr 300px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

.menu-item {
  padding: 12px;
  border: 1px solid cyan;
  cursor: pointer;
}

/* ================= SPLIT MENU ================= */

#splitUI {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 50;
}

.split {
  width: 50%;
  height: 100%;
  position: relative;
  cursor: pointer;
  transition: 0.4s ease;
  overflow: hidden;
}

.split video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.split:hover {
  filter: brightness(1.2);
}

.label {
  position: absolute;
  bottom: 40px;
  left: 30px;
  font-size: 30px;
  text-shadow: 0 0 10px cyan;
}

/* ================= SCENES ================= */

.scene {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 100;
}

.scene video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.scene-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
}

/* HUD inside scenes */
.scene-ui {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 50px;
  color: cyan;
  text-shadow: 0 0 15px cyan;
}

/* BACK BUTTON */
.back {
  position: absolute;
  top: 20px;
  left: 20px;
  padding: 10px;
  border: 1px solid cyan;
  cursor: pointer;
  z-index: 200;
}

/* ================= UTIL ================= */

.hide {
  display: none !important;
}

</style>
</head>

<body>

<!-- ================= MAIN HUD ================= -->
<div id="hud">

  <div>
    <div class="menu-item" onclick="openSelect()">MODE SELECT</div>
  </div>

  <div style="display:flex;align-items:center;justify-content:center;">
    SYSTEM ONLINE
  </div>

  <div>
    STATUS PANEL
  </div>

</div>

<!-- ================= SPLIT MENU ================= -->
<div id="splitUI">

  <div class="split" onclick="enterScene('A')">
    <video autoplay muted loop>
      <source src="modeA.mp4">
    </video>
    <div class="label">MODE A</div>
  </div>

  <div class="split" onclick="enterScene('B')">
    <video autoplay muted loop>
      <source src="modeB.mp4">
    </video>
    <div class="label">MODE B</div>
  </div>

</div>

<!-- ================= MODE A SCENE ================= -->
<div id="sceneA" class="scene">
  <video autoplay muted loop>
    <source src="modeA.mp4">
  </video>

  <div class="scene-overlay"></div>

  <div class="back" onclick="backToMenu()">BACK</div>

  <div class="scene-ui">
    MODE A ACTIVE
  </div>
</div>

<!-- ================= MODE B SCENE ================= -->
<div id="sceneB" class="scene">
  <video autoplay muted loop>
    <source src="modeB.mp4">
  </video>

  <div class="scene-overlay"></div>

  <div class="back" onclick="backToMenu()">BACK</div>

  <div class="scene-ui">
    MODE B ACTIVE
  </div>
</div>

<script>

const hud = document.getElementById("hud");
const splitUI = document.getElementById("splitUI");
const sceneA = document.getElementById("sceneA");
const sceneB = document.getElementById("sceneB");

/* OPEN MODE SELECT */
function openSelect(){
  hud.classList.add("hide");
  splitUI.style.display = "flex";
}

/* ENTER MODE (SEPARATE SCENES) */
function enterScene(mode){

  splitUI.style.display = "none";

  if(mode === "A"){
    sceneA.style.display = "block";
  }

  if(mode === "B"){
    sceneB.style.display = "block";
  }
}

/* BACK TO MENU */
function backToMenu(){

  sceneA.style.display = "none";
  sceneB.style.display = "none";

  hud.classList.remove("hide");
}

</script>

</body>
</html>
