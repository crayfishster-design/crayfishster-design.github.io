<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD SYSTEM</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial;
  background: black;
  color: cyan;
  overflow: hidden;
}

/* GRID BACKGROUND */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.06) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridMove 6s linear infinite;
  z-index: -3;
}

@keyframes gridMove {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

/* BOOT SCREEN */
#boot {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-size: 20px;
  z-index: 9999;
  animation: bootFade 2.8s forwards;
}

@keyframes bootFade {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

/* MENU */
.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  padding: 12px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.4);
  cursor: pointer;
  transition: 0.2s;
}

.menu-item:hover {
  transform: translateX(5px);
  box-shadow: 0 0 15px cyan;
}

/* CENTER */
.center {
  display: flex;
  justify-content: center;
  align-items: center;
}

.title {
  font-size: 42px;
  text-shadow: 0 0 10px cyan;
}

/* RIGHT PANEL */
.panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  padding: 15px;
  border: 1px solid rgba(0,255,255,0.2);
  background: rgba(0,0,0,0.4);
}

.bar {
  height: 10px;
  background: rgba(255,255,255,0.1);
  margin-top: 8px;
}

.fill {
  height: 100%;
  width: 0%;
  background: cyan;
  transition: 0.3s;
}

/* 🎵 BGM UI */
.bgm {
  position: fixed;
  bottom: 15px;
  left: 15px;
  padding: 10px;
  border: 1px solid cyan;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}

/* slider */
input[type="range"] {
  width: 130px;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">INITIALIZING SYSTEM CORE...</div>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <div class="menu-item" onclick="clickFX()">DASHBOARD</div>
    <div class="menu-item" onclick="clickFX()">PROFILE</div>
    <div class="menu-item" onclick="clickFX()">SYSTEM</div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="title">SYSTEM ONLINE</div>
  </div>

  <!-- RIGHT -->
  <div class="panel">

    <div class="card">
      CPU
      <div class="bar"><div class="fill" id="cpu"></div></div>
    </div>

    <div class="card">
      MEMORY
      <div class="bar"><div class="fill" id="ram"></div></div>
    </div>

    <div class="card">
      NETWORK
      <div class="bar"><div class="fill" id="net"></div></div>
    </div>

  </div>

</div>

<!-- 🎵 MP3 BACKGROUND MUSIC -->
<audio id="bgm" autoplay loop>
  <source src="bgm.mp3" type="audio/mp3">
</audio>

<!-- 🎚 VOLUME CONTROL -->
<div class="bgm">
  🎵 BGM Volume<br>
  <input type="range" min="0" max="1" step="0.01" value="0.5" id="vol"><br>
  <button onclick="toggleMusic()">Play / Pause</button>
</div>

<script>

/* CLICK SOUND */
let audioCtx;

function clickFX() {
  if (!audioCtx) audioCtx = new AudioContext();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.value = 650;

  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.08);
}

/* BGM CONTROL */
const bgm = document.getElementById("bgm");
const vol = document.getElementById("vol");

bgm.volume = 0.5;

vol.addEventListener("input", () => {
  bgm.volume = vol.value;
});

function toggleMusic() {
  if (bgm.paused) bgm.play();
  else bgm.pause();
}

/* FAKE SYSTEM STATS */
function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function updateStats(){
  document.getElementById("cpu").style.width = rand(10,95)+"%";
  document.getElementById("ram").style.width = rand(20,90)+"%";
  document.getElementById("net").style.width = rand(5,100)+"%";
}

setInterval(updateStats,1000);
updateStats();

</script>

</body>
</html>
