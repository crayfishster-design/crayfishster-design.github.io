<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD SYSTEM</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial;
  background: black;
  color: cyan;
  overflow: hidden;
}

/* GRID */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.06) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridMove 6s linear infinite;
  z-index: -3;
}

@keyframes gridMove {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

/* BOOT SCREEN */
#boot {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 22px;
  z-index: 9999;
  color: cyan;
  animation: bootOut 3s forwards;
}

@keyframes bootOut {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

/* MENU */
.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  padding: 12px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.4);
  cursor: pointer;
  transition: 0.2s;
}

.menu-item:hover {
  transform: translateX(5px);
  box-shadow: 0 0 15px cyan;
}

/* CENTER PAGES */
.center {
  position: relative;
}

.page {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 42px;
  opacity: 0;
  transform: scale(0.98);
  transition: 0.25s;
  pointer-events: none;
}

.page.active {
  opacity: 1;
  transform: scale(1);
  pointer-events: all;
}

/* RIGHT PANEL */
.panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  padding: 15px;
  border: 1px solid rgba(0,255,255,0.2);
  background: rgba(0,0,0,0.4);
}

.bar {
  height: 10px;
  background: rgba(255,255,255,0.1);
  margin-top: 8px;
}

.fill {
  height: 100%;
  width: 0%;
  background: cyan;
}

/* MUSIC CONTROLS (YouTube style) */
.music {
  position: fixed;
  bottom: 15px;
  left: 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;

  padding: 12px;
  border: 1px solid cyan;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}

.playBtn {
  font-size: 18px;
  cursor: pointer;
  background: none;
  border: 1px solid cyan;
  color: cyan;
  padding: 6px;
}

/* volume */
input[type="range"] {
  width: 140px;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">INITIALIZING SYSTEM CORE...</div>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <div class="menu-item" onclick="clickFX(); showPage('dashboard')">DASHBOARD</div>
    <div class="menu-item" onclick="clickFX(); showPage('profile')">PROFILE</div>
    <div class="menu-item" onclick="clickFX(); showPage('system')">SYSTEM</div>
  </div>

  <!-- CENTER -->
  <div class="center">

    <div class="page active" id="dashboard">DASHBOARD ONLINE</div>
    <div class="page" id="profile">USER PROFILE</div>
    <div class="page" id="system">SYSTEM STATUS</div>

  </div>

  <!-- RIGHT -->
  <div class="panel">
    <div class="card">CPU<div class="bar"><div class="fill" id="cpu"></div></div></div>
    <div class="card">MEMORY<div class="bar"><div class="fill" id="ram"></div></div></div>
    <div class="card">NETWORK<div class="bar"><div class="fill" id="net"></div></div></div>
  </div>

</div>

<!-- AUDIO -->
<audio id="bgm" loop autoplay>
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<!-- MUSIC UI -->
<div class="music">
  <button class="playBtn" onclick="toggleMusic()" id="playBtn">▶</button>
  <input type="range" min="0" max="1" step="0.01" id="vol">
</div>

<script>

/* BOOT FIX (ensures it actually shows before hiding) */
window.onload = () => {
  setTimeout(() => {
    document.getElementById("boot").style.display = "none";
  }, 3000);
};

/* PAGE SWITCH */
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* CLICK SOUND + SYNTH */
let ctx;

function clickFX() {
  if (!ctx) ctx = new AudioContext();
  if (ctx.state === "suspended") ctx.resume();

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "square";
  osc.frequency.value = 800;

  gain.gain.setValueAtTime(0.05, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime + 0.08);
}

/* SYSTEM STATS */
function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

setInterval(() => {
  document.getElementById("cpu").style.width = rand(10,95)+"%";
  document.getElementById("ram").style.width = rand(20,90)+"%";
  document.getElementById("net").style.width = rand(5,100)+"%";
}, 1000);

/* MUSIC CONTROL (YouTube style toggle) */
const bgm = document.getElementById("bgm");
const vol = document.getElementById("vol");
const btn = document.getElementById("playBtn");

bgm.volume = 0.5;

/* try autoplay */
window.addEventListener("click", () => {
  bgm.play().catch(()=>{});
}, { once: true });

function toggleMusic() {
  if (bgm.paused) {
    bgm.play();
    btn.innerHTML = "⏸";
  } else {
    bgm.pause();
    btn.innerHTML = "▶";
  }
}

/* volume */
vol.addEventListener("input", () => {
  bgm.volume = vol.value;
});

</script>

</body>
</html>
