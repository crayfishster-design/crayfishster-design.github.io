<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Arial;
  background:black;
  color:cyan;
  overflow:hidden;
}

/* VIDEO */
#bgvid{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-5;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  z-index:-4;
}

/* GRID */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,255,255,0.05)1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,255,0.05)1px,transparent 1px);
  background-size:40px 40px;
  animation:grid 6s linear infinite;
  z-index:-3;
}

@keyframes grid{
  from{transform:translateY(0);}
  to{transform:translateY(40px);}
}

/* LAYOUT */
.container{
  display:grid;
  grid-template-columns:260px 1fr 320px;
  height:100vh;
  padding:20px;
  gap:20px;
}

/* MENU */
.menu{display:flex;flex-direction:column;gap:10px;}

.menu-item{
  padding:12px;
  border:1px solid rgba(0,255,255,0.3);
  background:rgba(0,0,0,0.4);
  cursor:pointer;
}

.menu-item:hover{
  box-shadow:0 0 15px cyan;
  transform:translateX(5px);
}

/* CENTER */
.center{
  position:relative;
}

.page{
  position:absolute;
  inset:0;
  opacity:0;
  transform:translateX(40px);
  transition:.3s;
  pointer-events:none;
}

.page.active{
  opacity:1;
  transform:translateX(0);
  pointer-events:all;
}

/* RIGHT PANEL */
.panel{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.card{
  padding:15px;
  border:1px solid rgba(0,255,255,0.2);
  background:rgba(0,0,0,0.4);
}

.bar{
  height:10px;
  background:rgba(255,255,255,0.1);
  margin-top:8px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:cyan;
  transition:width .6s ease;
}

/* BGM UI */
.bgm-ui{
  position:fixed;
  bottom:10px;
  left:10px;
  padding:10px;
  border:1px solid cyan;
  background:rgba(0,0,0,0.6);
  z-index:999;
}

.bgm-ui input{width:120px;}

/* VISUALIZER */
#visualizer{
  position:fixed;
  bottom:0;
  right:0;
  width:250px;
  height:100px;
  z-index:999;
  background:rgba(0,0,0,0.4);
  border:1px solid cyan;
}
</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop playsinline id="bgvid">
  <source src="bg.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <div class="menu-item">DASHBOARD</div>
    <div class="menu-item">PROFILE</div>
    <div class="menu-item">SYSTEM</div>
  </div>

  <!-- CENTER -->
  <div class="center">

    <div class="page active" id="dash">
      SYSTEM ONLINE
    </div>

    <div class="page" id="profile">
      PROFILE PAGE
    </div>

  </div>

  <!-- RIGHT -->
  <div class="panel">

    <div class="card">CPU<div class="bar"><div class="fill" id="cpu"></div></div></div>
    <div class="card">RAM<div class="bar"><div class="fill" id="ram"></div></div></div>
    <div class="card">NET<div class="bar"><div class="fill" id="net"></div></div></div>

  </div>

</div>

<!-- BGM -->
<div class="bgm-ui">
  🎵 BGM
  <br>
  <input id="vol" type="range" min="0" max="1" step="0.01">
  <br>
  <button onclick="toggle()">Play/Pause</button>

  <audio id="bgm" loop>
    <source src="bgm.mp3">
  </audio>
</div>

<!-- VISUALIZER -->
<canvas id="visualizer"></canvas>

<script>

/* PAGE SWITCH */
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* AUDIO */
const audio = document.getElementById("bgm");
const vol = document.getElementById("vol");
audio.volume = 0.5;

vol.oninput = () => audio.volume = vol.value;

function toggle(){
  if(audio.paused) audio.play();
  else audio.pause();
}

/* AUTO PLAY FIX */
document.addEventListener("click", ()=>audio.play(), {once:true});

/* CLICK SOUND */
let ctx;
function clickFX(){
  if(!ctx) ctx = new AudioContext();
  const o = ctx.createOscillator();
  const g = ctx.createGain();

  o.type="square";
  o.frequency.value=600;

  g.gain.setValueAtTime(0.05,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);

  o.connect(g);
  g.connect(ctx.destination);

  o.start();
  o.stop(ctx.currentTime+0.08);
}

/* CPU RAM NET SMOOTH */
function lerp(a,b,t){return a+(b-a)*t;}
let cpu=0,ram=0,net=0;

setInterval(()=>{
  cpu = lerp(cpu,Math.random()*100,0.2);
  ram = lerp(ram,Math.random()*100,0.2);
  net = lerp(net,Math.random()*100,0.2);

  document.getElementById("cpu").style.width=cpu+"%";
  document.getElementById("ram").style.width=ram+"%";
  document.getElementById("net").style.width=net+"%";
},500);

/* AUDIO VISUALIZER */
const canvas = document.getElementById("visualizer");
const ctx2 = canvas.getContext("2d");

canvas.width = 250;
canvas.height = 100;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const src = audioCtx.createMediaElementSource(audio);
const analyser = audioCtx.createAnalyser();

src.connect(analyser);
analyser.connect(audioCtx.destination);

analyser.fftSize = 64;

const buffer = new Uint8Array(analyser.frequencyBinCount);

function draw(){
  requestAnimationFrame(draw);

  analyser.getByteFrequencyData(buffer);

  ctx2.clearRect(0,0,canvas.width,canvas.height);

  let barWidth = canvas.width / buffer.length;

  for(let i=0;i<buffer.length;i++){
    let h = buffer[i]/2;

    ctx2.fillStyle="cyan";
    ctx2.fillRect(i*barWidth,canvas.height-h,barWidth-2,h);
  }
}

draw();

</script>

</body>
</html>
