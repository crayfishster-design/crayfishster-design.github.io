<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD SYSTEM</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial;
  color: cyan;
  overflow: hidden;
  background: black;
}

/* 🎥 BACKGROUND VIDEO */
#bgvid {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -5;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: -4;
}

/* GRID */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: grid 6s linear infinite;
  z-index: -3;
}

@keyframes grid {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

/* BOOT */
#boot {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: boot 2.5s forwards;
}

@keyframes boot {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

/* MENU */
.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  padding: 12px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.4);
  cursor: pointer;
  transition: 0.2s;
}

.menu-item:hover {
  transform: translateX(5px);
  box-shadow: 0 0 15px cyan;
}

/* CENTER */
.center {
  position: relative;
}

.page {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: translateX(50px);
  pointer-events: none;
  transition: 0.4s ease;
}

.page.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: all;
}

/* DASHBOARD */
#dashboard {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 40px;
}

/* PROFILE SPLIT */
.split {
  display: flex;
  width: 100%;
  height: 100%;
}

.split-item {
  width: 50%;
  height: 100vh;
  position: relative;
  cursor: pointer;
  overflow: hidden;
}

.split-item:hover {
  transform: scale(1.02);
  filter: brightness(1.2);
}

.split-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.label {
  position: absolute;
  bottom: 20px;
  left: 20px;
  font-size: 22px;
}

/* RIGHT PANEL */
.panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  padding: 15px;
  border: 1px solid rgba(0,255,255,0.2);
  background: rgba(0,0,0,0.4);
}

.bar {
  height: 10px;
  background: rgba(255,255,255,0.1);
  margin-top: 8px;
}

.fill {
  height: 100%;
  width: 0%;
  background: cyan;
}

/* 🎵 BGM UI */
.bgm-ui {
  position: fixed;
  bottom: 15px;
  left: 15px;
  padding: 12px;
  background: rgba(0,0,0,0.6);
  border: 1px solid cyan;
  backdrop-filter: blur(10px);
  z-index: 999;
  color: cyan;
}

.bgm-ui input {
  width: 140px;
  margin: 8px 0;
}

.bgm-ui button {
  background: transparent;
  border: 1px solid cyan;
  color: cyan;
  padding: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- 🎥 VIDEO -->
<video autoplay muted loop playsinline id="bgvid">
  <source src="bg.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<!-- BOOT -->
<div id="boot">INITIALIZING SYSTEM...</div>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <div class="menu-item" onclick="clickFX(); showPage('dashboard')">DASHBOARD</div>
    <div class="menu-item" onclick="clickFX(); showPage('profile')">PROFILE</div>
    <div class="menu-item" onclick="clickFX(); showPage('system')">SYSTEM</div>
  </div>

  <!-- CENTER -->
  <div class="center">

    <div class="page active" id="dashboard">
      SYSTEM ONLINE
    </div>

    <div class="page" id="profile">
      <div class="split">

        <div class="split-item" onclick="clickFX(); showPage('ui1')">
          <img src="https://images.unsplash.com/photo-1520975922284-9f0f2b0f8f7c">
          <div class="label">UI SYSTEM A</div>
        </div>

        <div class="split-item" onclick="clickFX(); showPage('ui2')">
          <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5">
          <div class="label">UI SYSTEM B</div>
        </div>

      </div>
    </div>

    <div class="page" id="system">SYSTEM STATUS</div>
    <div class="page" id="ui1">UI SYSTEM A</div>
    <div class="page" id="ui2">UI SYSTEM B</div>

  </div>

  <!-- RIGHT -->
  <div class="panel">

    <div class="card">CPU <div class="bar"><div class="fill" id="cpu"></div></div></div>
    <div class="card">RAM <div class="bar"><div class="fill" id="ram"></div></div></div>
    <div class="card">NET <div class="bar"><div class="fill" id="net"></div></div></div>

  </div>

</div>

<!-- 🎵 BGM UI -->
<div class="bgm-ui">
  🎵 BGM SYSTEM

  <br>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5">
  <br>
  <button onclick="toggleBGM()">Play / Pause</button>

  <audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>
</div>

<script>

let current = "dashboard";

/* PAGE SWITCH */
function showPage(id){
  if(id === current) return;

  document.getElementById(current).classList.remove("active");
  document.getElementById(id).classList.add("active");

  current = id;
}

/* CLICK SOUND */
let ctx;
function clickFX(){
  if(!ctx) ctx = new AudioContext();
  if(ctx.state === "suspended") ctx.resume();

  const o = ctx.createOscillator();
  const g = ctx.createGain();

  o.type = "square";
  o.frequency.value = 700;

  g.gain.setValueAtTime(0.05, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);

  o.connect(g);
  g.connect(ctx.destination);

  o.start();
  o.stop(ctx.currentTime + 0.08);
}

/* BGM */
const bgm = document.getElementById("bgm");
const vol = document.getElementById("vol");

bgm.volume = 0.5;

/* autoplay fix */
document.addEventListener("click", () => {
  bgm.play().catch(()=>{});
}, { once:true });

vol.addEventListener("input", () => {
  bgm.volume = vol.value;
});

function toggleBGM(){
  if(bgm.paused) bgm.play();
  else bgm.pause();
}

/* SYSTEM BARS */
function rand(){ return Math.random()*100; }

setInterval(()=>{
  document.getElementById("cpu").style.width = rand()+"%";
  document.getElementById("ram").style.width = rand()+"%";
  document.getElementById("net").style.width = rand()+"%";
},1000);

</script>

</body>
</html>
