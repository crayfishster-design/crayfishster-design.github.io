<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  color: #cfffff;
  overflow: hidden;
  background: black;
}

/* GRID BACKGROUND */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridMove 6s linear infinite;
  z-index: -2;
}

@keyframes gridMove {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: -1;
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

/* MENU */
.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  padding: 12px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  cursor: pointer;
  transition: 0.2s;
}

.menu-item:hover {
  transform: translateX(5px);
  border-color: cyan;
  box-shadow: 0 0 15px cyan;
}

/* CENTER */
.center {
  display: flex;
  justify-content: center;
  align-items: center;
}

.page {
  display: none;
  flex-direction: column;
  text-align: center;
}

.page.active {
  display: flex;
}

.title {
  font-size: 42px;
  letter-spacing: 3px;
}

.subtitle {
  opacity: 0.7;
  margin-top: 10px;
}

.glow {
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* RIGHT PANEL */
.panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  padding: 15px;
  border: 1px solid rgba(0,255,255,0.2);
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
}

.bar {
  height: 10px;
  background: rgba(255,255,255,0.1);
  margin-top: 8px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0%;
  background: cyan;
  transition: width 0.4s ease;
}

/* BOOT */
#boot {
  position: fixed;
  inset: 0;
  background: black;
  color: cyan;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 20px;
  z-index: 9999;
  animation: bootFade 2.5s forwards;
}

@keyframes bootFade {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}
</style>
</head>

<body>

<div id="boot">INITIALIZING SYSTEM...</div>
<div class="overlay"></div>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <div class="menu-item" onclick="clickSound(); showPage('dashboard')">DASHBOARD</div>
    <div class="menu-item" onclick="clickSound(); showPage('profile')">PROFILE</div>
    <div class="menu-item" onclick="clickSound(); showPage('projects')">PROJECTS</div>
    <div class="menu-item" onclick="clickSound(); showPage('settings')">SETTINGS</div>
  </div>

  <!-- CENTER -->
  <div class="center">

    <div class="page active" id="dashboard">
      <div class="title glow">SYSTEM ONLINE</div>
      <div class="subtitle">Monitoring active processes</div>
    </div>

    <div class="page" id="profile">
      <div class="title glow">USER PROFILE</div>
      <div class="subtitle">Identity module loaded</div>
    </div>

    <div class="page" id="projects">
      <div class="title glow">PROJECTS</div>
      <div class="subtitle">No active missions</div>
    </div>

    <div class="page" id="settings">
      <div class="title glow">SETTINGS</div>
      <div class="subtitle">System configuration panel</div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="panel">

    <div class="card">
      CPU
      <div class="bar"><div class="fill" id="cpu"></div></div>
    </div>

    <div class="card">
      MEMORY
      <div class="bar"><div class="fill" id="ram"></div></div>
    </div>

    <div class="card">
      NETWORK
      <div class="bar"><div class="fill" id="net"></div></div>
    </div>

  </div>

</div>

<!-- AUDIO SYSTEM -->
<audio id="click1" src="https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1126.mp3"></audio>

<script>

/* PAGE SWITCH */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* OPERA GX STYLE CLICK SOUND */
function clickSound() {
  const sound = document.getElementById("click1");
  sound.currentTime = 0;
  sound.volume = 0.4;
  sound.play();
}

/* FAKE SYSTEM STATS */
function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function updateStats() {
  document.getElementById("cpu").style.width = rand(10, 95) + "%";
  document.getElementById("ram").style.width = rand(20, 90) + "%";
  document.getElementById("net").style.width = rand(5, 100) + "%";
}

setInterval(updateStats, 1000);
updateStats();

</script>

</body>
</html>
