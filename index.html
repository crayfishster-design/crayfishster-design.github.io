<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cinematic Site</title>

<style>
/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ===== VIDEO BACKGROUND ===== */
.video-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
  animation: zoom 20s ease-in-out infinite alternate;
}

/* slow cinematic zoom */
@keyframes zoom {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}

/* ===== OVERLAY ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(2px);
  z-index: -1;
}

/* ===== CENTER CONTENT ===== */
.content {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  font-family: Arial, sans-serif;

  opacity: 0;
  animation: fadeIn 1.5s ease forwards;
}

@keyframes fadeIn {
  to { opacity: 1; transform: translateY(0); }
  from { opacity: 0; transform: translateY(20px); }
}

/* ===== TEXT ===== */
h1 {
  font-size: 3.2rem;
  letter-spacing: 2px;
}

p {
  margin-top: 10px;
  opacity: 0.8;
}

/* ===== BUTTON ===== */
button {
  margin-top: 25px;
  padding: 12px 22px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;

  color: white;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);

  transition: 0.3s ease;
  backdrop-filter: blur(6px);
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.15);
}
</style>
</head>

<body>

<!-- VIDEO (replace bg.mp4 with your file OR use a link) -->
<video class="video-bg" autoplay muted loop playsinline>
  <source src="bg.mp4" type="video/mp4">
</video>

<!-- DARK OVERLAY -->
<div class="overlay"></div>

<!-- CONTENT -->
<div class="content">
  <h1>WELCOME</h1>
  <p>A clean cinematic GitHub Pages site</p>

  <button onclick="alert('🔥 Nice site')">
    Enter
  </button>
</div>

</body>
</html>
