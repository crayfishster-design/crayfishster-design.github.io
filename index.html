<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD SYSTEM</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial;
  color: cyan;
  overflow: hidden;
  background: black;
}

/* 🎥 VIDEO BACKGROUND */
#bgvid {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -5;
}

.video-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: -4;
}

/* GRID */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: grid 6s linear infinite;
  z-index: -3;
}

@keyframes grid {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

/* BOOT */
#boot {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: boot 2.5s forwards;
}

@keyframes boot {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

/* MENU */
.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  padding: 12px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.4);
  cursor: pointer;
  transition: 0.2s;
}

.menu-item:hover {
  transform: translateX(5px);
  box-shadow: 0 0 15px cyan;
}

/* PAGES */
.center {
  position: relative;
}

.page {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 42px;
  opacity: 0;
  transition: 0.25s;
  pointer-events: none;
}

.page.active {
  opacity: 1;
  pointer-events: all;
}

/* RIGHT PANEL */
.panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  padding: 15px;
  border: 1px solid rgba(0,255,255,0.2);
  background: rgba(0,0,0,0.4);
}

.bar {
  height: 10px;
  background: rgba(255,255,255,0.1);
  margin-top: 8px;
}

.fill {
  height: 100%;
  width: 0%;
  background: cyan;
}

/* VISUALIZER */
.visualizer {
  position: fixed;
  bottom: 100px;
  left: 20px;
  display: flex;
  gap: 3px;
  height: 80px;
  align-items: flex-end;
}

.vbar {
  width: 4px;
  height: 10px;
  background: cyan;
  box-shadow: 0 0 8px cyan;
}

/* MUSIC */
.music {
  position: fixed;
  bottom: 15px;
  left: 15px;
  padding: 10px;
  border: 1px solid cyan;
  background: rgba(0,0,0,0.6);
}

/* EMAIL FORM */
form {
  position: fixed;
  right: 20px;
  bottom: 120px;
  width: 250px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

input, textarea {
  background: black;
  border: 1px solid cyan;
  color: cyan;
  padding: 5px;
}

button {
  background: black;
  border: 1px solid cyan;
  color: cyan;
  cursor: pointer;
}

/* ================= PROFILE SPLIT UI ================= */

#splitUI {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 50;
}

.split {
  width: 50%;
  height: 100%;
  float: left;
  position: relative;
  cursor: pointer;
  overflow: hidden;
}

.split video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.split span {
  position: absolute;
  bottom: 30px;
  left: 30px;
  font-size: 28px;
  text-shadow: 0 0 10px cyan;
}

/* FULLSCREEN MODE */
.fullscreen {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 100;
}

.fullscreen video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.back {
  position: absolute;
  top: 20px;
  left: 20px;
  padding: 10px;
  border: 1px solid cyan;
  background: rgba(0,0,0,0.5);
  cursor: pointer;
}

</style>
</head>

<body>

<!-- 🎥 VIDEO -->
<video autoplay muted loop playsinline id="bgvid">
  <source src="bg.mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<!-- BOOT -->
<div id="boot">INITIALIZING SYSTEM CORE...</div>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <div class="menu-item" onclick="clickFX(); showPage('dashboard')">DASHBOARD</div>
    <div class="menu-item" onclick="clickFX(); showPage('profile')">PROFILE</div>
    <div class="menu-item" onclick="clickFX(); showPage('system')">SYSTEM</div>
  </div>

  <!-- CENTER -->
  <div class="center">

    <div class="page active" id="dashboard">DASHBOARD ONLINE</div>
    <div class="page" id="profile">PROFILE MODULE</div>
    <div class="page" id="system">SYSTEM STATUS</div>

  </div>

  <!-- RIGHT -->
  <div class="panel">

    <div class="card">
      CPU
      <div class="bar"><div class="fill" id="cpu"></div></div>
    </div>

    <div class="card">
      MEMORY
      <div class="bar"><div class="fill" id="ram"></div></div>
    </div>

    <div class="card">
      NETWORK
      <div class="bar"><div class="fill" id="net"></div></div>
    </div>

  </div>

</div>

<!-- SPLIT PROFILE UI -->
<div id="splitUI">

  <div class="split" onclick="openMode('A')">
    <video autoplay muted loop>
      <source src="modeA.mp4">
    </video>
    <span>PROFILE A</span>
  </div>

  <div class="split" onclick="openMode('B')">
    <video autoplay muted loop>
      <source src="modeB.mp4">
    </video>
    <span>PROFILE B</span>
  </div>

</div>

<!-- FULLSCREEN MODES -->
<div id="modeA" class="fullscreen">
  <video autoplay muted loop>
    <source src="modeA.mp4">
  </video>
  <div class="back" onclick="back()">BACK</div>
</div>

<div id="modeB" class="fullscreen">
  <video autoplay muted loop>
    <source src="modeB.mp4">
  </video>
  <div class="back" onclick="back()">BACK</div>
</div>

<!-- VISUALIZER -->
<div class="visualizer" id="vis"></div>

<!-- MUSIC -->
<audio id="bgm" loop>
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<div class="music">
  <button onclick="toggleMusic()">▶ / ⏸</button><br>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5">
</div>

<!-- EMAIL -->
<form action="https://formsubmit.co/YOUR_EMAIL@gmail.com" method="POST">
  <input type="hidden" name="_captcha" value="false">
  <input name="name" placeholder="Name">
  <input name="email" placeholder="Email">
  <textarea name="message" placeholder="Message"></textarea>
  <button type="submit">Send</button>
</form>

<script>

/* PAGE SWITCH */
function showPage(id){

  if(id === "profile"){
    document.querySelector(".container").style.display = "none";
    document.getElementById("splitUI").style.display = "block";
    return;
  }

  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* PROFILE MODES */
function openMode(m){
  document.getElementById("splitUI").style.display = "none";
  document.getElementById("modeA").style.display = (m==="A") ? "block" : "none";
  document.getElementById("modeB").style.display = (m==="B") ? "block" : "none";
}

function back(){
  document.getElementById("modeA").style.display = "none";
  document.getElementById("modeB").style.display = "none";
  document.querySelector(".container").style.display = "grid";
}

/* CLICK SOUND */
let ctx;
function clickFX(){
  if(!ctx) ctx = new AudioContext();
  const o = ctx.createOscillator();
  const g = ctx.createGain();

  o.type="square";
  o.frequency.value=700;

  g.gain.setValueAtTime(0.05,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.08);

  o.connect(g);
  g.connect(ctx.destination);

  o.start();
  o.stop(ctx.currentTime+0.08);
}

/* MUSIC */
const audio=document.getElementById("bgm");
const vol=document.getElementById("vol");
audio.volume=0.5;

vol.oninput=()=>audio.volume=vol.value;

function toggleMusic(){
  audio.paused ? audio.play() : audio.pause();
}

/* STATS */
let cpu=0,ram=0,net=0;
setInterval(()=>{
  cpu+=(Math.random()*100-cpu)*0.1;
  ram+=(Math.random()*100-ram)*0.1;
  net+=(Math.random()*100-net)*0.1;

  cpu.style?0:0;
  document.getElementById("cpu").style.width=cpu+"%";
  document.getElementById("ram").style.width=ram+"%";
  document.getElementById("net").style.width=net+"%";
},500);

</script>

</body>
</html>
