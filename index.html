<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD SYSTEM</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  color: cyan;
  font-family: Arial;
  overflow: hidden;
}

/* GRID BACKGROUND */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: grid 6s linear infinite;
  z-index: -3;
}

@keyframes grid {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

/* BOOT */
#boot {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: boot 2.8s forwards;
}

@keyframes boot {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

/* MENU */
.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  padding: 12px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.4);
  cursor: pointer;
  transition: 0.2s;
}

.menu-item:hover {
  transform: translateX(5px);
  box-shadow: 0 0 15px cyan;
}

/* CENTER */
.center {
  display: flex;
  justify-content: center;
  align-items: center;
}

.title {
  font-size: 42px;
  text-shadow: 0 0 10px cyan;
}

/* RIGHT PANEL */
.panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  padding: 15px;
  border: 1px solid rgba(0,255,255,0.2);
  background: rgba(0,0,0,0.4);
}

.bar {
  height: 10px;
  background: rgba(255,255,255,0.1);
  margin-top: 8px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0%;
  background: cyan;
  transition: width 0.1s linear;
}

/* MUSIC UI */
.music {
  position: fixed;
  bottom: 15px;
  left: 15px;
  padding: 10px;
  border: 1px solid cyan;
  background: rgba(0,0,0,0.6);
}

button {
  background: black;
  border: 1px solid cyan;
  color: cyan;
  cursor: pointer;
  margin-top: 5px;
}
</style>
</head>

<body>

<!-- BOOT SCREEN -->
<div id="boot">INITIALIZING SYSTEM CORE...</div>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <div class="menu-item">DASHBOARD</div>
    <div class="menu-item">PROFILE</div>
    <div class="menu-item">SYSTEM</div>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="title">SYSTEM ONLINE</div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">

    <div class="card">
      CPU
      <div class="bar"><div class="fill" id="cpu"></div></div>
    </div>

    <div class="card">
      MEMORY
      <div class="bar"><div class="fill" id="ram"></div></div>
    </div>

    <div class="card">
      NETWORK
      <div class="bar"><div class="fill" id="net"></div></div>
    </div>

  </div>

</div>

<!-- MUSIC -->
<audio id="bgm" autoplay loop>
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<div class="music">
  <button onclick="toggleMusic()">▶ / ⏸</button><br>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5">
</div>

<script>

/* MUSIC */
const bgm = document.getElementById("bgm");
const vol = document.getElementById("vol");

bgm.volume = 0.5;

vol.oninput = () => {
  bgm.volume = vol.value;
};

function toggleMusic(){
  if (bgm.paused) bgm.play();
  else bgm.pause();
}

/* SMOOTH STATS */
function rand(min, max){
  return Math.random() * (max - min) + min;
}

let cpu = 0, ram = 0, net = 0;

let cpuT = rand(10,95);
let ramT = rand(20,90);
let netT = rand(5,100);

const speed = 0.05;

function updateTargets(){
  cpuT = rand(10,95);
  ramT = rand(20,90);
  netT = rand(5,100);
}

function animate(){
  cpu += (cpuT - cpu) * speed;
  ram += (ramT - ram) * speed;
  net += (netT - net) * speed;

  document.getElementById("cpu").style.width = cpu + "%";
  document.getElementById("ram").style.width = ram + "%";
  document.getElementById("net").style.width = net + "%";

  requestAnimationFrame(animate);
}

setInterval(updateTargets, 1000);
updateTargets();
animate();

</script>

</body>
</html>
