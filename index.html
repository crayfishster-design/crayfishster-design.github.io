<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD SYSTEM</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial;
  background: black;
  color: cyan;
  overflow: hidden;
}

/* GRID BACKGROUND */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.06) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridMove 6s linear infinite;
  z-index: -3;
}

@keyframes gridMove {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

/* MENU */
.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  padding: 12px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.4);
  cursor: pointer;
  transition: 0.2s;
}

.menu-item:hover {
  transform: translateX(5px);
  box-shadow: 0 0 15px cyan;
}

/* CENTER FIX (IMPORTANT CHANGE) */
.center {
  position: relative;
  width: 100%;
  height: 100%;
}

/* PAGES FIXED PROPERLY */
.page {
  position: absolute;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 42px;
  text-shadow: 0 0 10px cyan;

  opacity: 0;
  transform: scale(0.98);
  transition: 0.25s ease;
  pointer-events: none;
}

.page.active {
  opacity: 1;
  transform: scale(1);
  pointer-events: all;
}

/* RIGHT PANEL */
.panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  padding: 15px;
  border: 1px solid rgba(0,255,255,0.2);
  background: rgba(0,0,0,0.4);
}

.bar {
  height: 10px;
  background: rgba(255,255,255,0.1);
  margin-top: 8px;
}

.fill {
  height: 100%;
  width: 0%;
  background: cyan;
  transition: 0.3s;
}

/* BGM */
.bgm {
  position: fixed;
  bottom: 15px;
  left: 15px;
  padding: 12px;
  border: 1px solid cyan;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}

button {
  margin-top: 5px;
  padding: 5px 10px;
  cursor: pointer;
  background: black;
  color: cyan;
  border: 1px solid cyan;
}

input[type="range"] {
  width: 130px;
}
</style>
</head>

<body>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <div class="menu-item" onclick="clickFX(); showPage('dashboard')">DASHBOARD</div>
    <div class="menu-item" onclick="clickFX(); showPage('profile')">PROFILE</div>
    <div class="menu-item" onclick="clickFX(); showPage('system')">SYSTEM</div>
  </div>

  <!-- CENTER -->
  <div class="center">

    <div class="page active" id="dashboard">
      SYSTEM DASHBOARD
    </div>

    <div class="page" id="profile">
      USER PROFILE
    </div>

    <div class="page" id="system">
      SYSTEM STATUS
    </div>

  </div>

  <!-- RIGHT -->
  <div class="panel">
    <div class="card">CPU<div class="bar"><div class="fill" id="cpu"></div></div></div>
    <div class="card">MEMORY<div class="bar"><div class="fill" id="ram"></div></div></div>
    <div class="card">NETWORK<div class="bar"><div class="fill" id="net"></div></div></div>
  </div>

</div>

<!-- AUDIO -->
<audio id="bgm" loop>
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<!-- BGM UI -->
<div class="bgm">
  🎵 BGM<br>
  <button onclick="bgm.play()">START</button>
  <button onclick="bgm.pause()">PAUSE</button><br><br>
  <input type="range" min="0" max="1" step="0.01" value="0.5" id="vol">
</div>

<script>

/* CLICK SOUND */
let audioCtx;

function clickFX() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === "suspended") audioCtx.resume();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.value = 700;

  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.08);
}

/* PAGE SWITCH (FIXED) */
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => {
    p.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
}

/* SYSTEM STATS */
function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function updateStats(){
  document.getElementById("cpu").style.width = rand(10,95)+"%";
  document.getElementById("ram").style.width = rand(20,90)+"%";
  document.getElementById("net").style.width = rand(5,100)+"%";
}

setInterval(updateStats,1000);
updateStats();

/* VOLUME */
const bgm = document.getElementById("bgm");
const vol = document.getElementById("vol");

bgm.volume = 0.5;

vol.addEventListener("input", () => {
  bgm.volume = vol.value;
});

</script>

</body>
</html>
