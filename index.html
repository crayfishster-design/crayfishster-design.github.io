<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD</title>

<style>
/* =======================
   BASE
======================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  color: #cfffff;
  overflow: hidden;
  background: black;
}

/* =======================
   VIDEO BACKGROUND
======================= */
.video-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -3;
  animation: zoom 20s ease-in-out infinite alternate;
}

@keyframes zoom {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}

/* fallback dark overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: -2;
}

/* animated grid */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridMove 6s linear infinite;
  z-index: -1;
}

@keyframes gridMove {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

/* =======================
   LAYOUT
======================= */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

/* =======================
   LEFT MENU
======================= */
.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  padding: 12px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  cursor: pointer;
  transition: 0.2s;
}

.menu-item:hover {
  transform: translateX(5px);
  border-color: cyan;
  box-shadow: 0 0 15px cyan;
}

/* =======================
   CENTER PAGES
======================= */
.center {
  display: flex;
  justify-content: center;
  align-items: center;
}

.page {
  display: none;
  flex-direction: column;
  text-align: center;
}

.page.active {
  display: flex;
}

.title {
  font-size: 42px;
  letter-spacing: 3px;
}

.subtitle {
  opacity: 0.7;
  margin-top: 10px;
}

.glow {
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* =======================
   RIGHT PANEL
======================= */
.panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  padding: 15px;
  border: 1px solid rgba(0,255,255,0.2);
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
}

.bar {
  height: 8px;
  background: rgba(255,255,255,0.1);
  margin-top: 8px;
}

.fill {
  height: 100%;
  background: cyan;
}

/* =======================
   BOOT EFFECT (optional feel)
======================= */
#boot {
  position: fixed;
  inset: 0;
  background: black;
  color: cyan;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 20px;
  z-index: 9999;
  animation: bootFade 2.5s forwards;
}

@keyframes bootFade {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}
</style>
</head>

<body>

<!-- BOOT SCREEN -->
<div id="boot">INITIALIZING SYSTEM...</div>

<!-- VIDEO BACKGROUND (replace bg.mp4 with your own if needed) -->
<video class="video-bg" autoplay muted loop playsinline>
  <source src="bg.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

  <!-- LEFT MENU -->
  <div class="menu">
    <div class="menu-item" onclick="showPage('dashboard')">DASHBOARD</div>
    <div class="menu-item" onclick="showPage('profile')">PROFILE</div>
    <div class="menu-item" onclick="showPage('projects')">PROJECTS</div>
    <div class="menu-item" onclick="showPage('settings')">SETTINGS</div>
  </div>

  <!-- CENTER -->
  <div class="center">

    <div class="page active" id="dashboard">
      <div class="title glow">SYSTEM DASHBOARD</div>
      <div class="subtitle">All systems operational</div>
    </div>

    <div class="page" id="profile">
      <div class="title glow">USER PROFILE</div>
      <div class="subtitle">Identity module loaded</div>
    </div>

    <div class="page" id="projects">
      <div class="title glow">PROJECTS</div>
      <div class="subtitle">No active missions</div>
    </div>

    <div class="page" id="settings">
      <div class="title glow">SETTINGS</div>
      <div class="subtitle">System configuration panel</div>
    </div>

  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">

    <div class="card">
      CPU
      <div class="bar"><div class="fill" style="width:70%"></div></div>
    </div>

    <div class="card">
      MEMORY
      <div class="bar"><div class="fill" style="width:50%"></div></div>
    </div>

    <div class="card">
      NETWORK
      <div class="bar"><div class="fill" style="width:80%"></div></div>
    </div>

  </div>

</div>

<script>
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
