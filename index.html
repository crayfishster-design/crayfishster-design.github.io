<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS HUD SYSTEM</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  color: cyan;
  font-family: Arial;
  overflow: hidden;
}

/* GRID */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: grid 6s linear infinite;
  z-index: -3;
}

@keyframes grid {
  from { transform: translateY(0); }
  to { transform: translateY(40px); }
}

/* BOOT */
#boot {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: boot 3s forwards;
}

@keyframes boot {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  height: 100vh;
  padding: 20px;
  gap: 20px;
}

/* MENU */
.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-item {
  padding: 12px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(0,0,0,0.4);
  cursor: pointer;
}

.menu-item:hover {
  box-shadow: 0 0 15px cyan;
  transform: translateX(5px);
}

/* CENTER PAGES */
.center {
  position: relative;
}

.page {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 42px;
  opacity: 0;
  transition: 0.25s;
  pointer-events: none;
}

.page.active {
  opacity: 1;
  pointer-events: all;
}

/* RIGHT PANEL */
.panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.card {
  padding: 15px;
  border: 1px solid rgba(0,255,255,0.2);
  background: rgba(0,0,0,0.4);
}

.bar {
  height: 10px;
  background: rgba(255,255,255,0.1);
}

.fill {
  height: 100%;
  width: 0%;
  background: cyan;
}

/* 🎧 VISUALIZER */
.visualizer {
  position: fixed;
  bottom: 90px;
  left: 20px;
  display: flex;
  gap: 3px;
  height: 80px;
  align-items: flex-end;
}

.vbar {
  width: 4px;
  height: 10px;
  background: cyan;
  box-shadow: 0 0 8px cyan;
}

/* MUSIC UI */
.music {
  position: fixed;
  bottom: 15px;
  left: 15px;
  padding: 10px;
  border: 1px solid cyan;
  background: rgba(0,0,0,0.6);
}

button {
  background: black;
  border: 1px solid cyan;
  color: cyan;
  cursor: pointer;
  margin-top: 5px;
}
</style>
</head>

<body>

<div id="boot">INITIALIZING SYSTEM...</div>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <div class="menu-item" onclick="clickFX(); showPage('dashboard')">DASHBOARD</div>
    <div class="menu-item" onclick="clickFX(); showPage('profile')">PROFILE</div>
    <div class="menu-item" onclick="clickFX(); showPage('system')">SYSTEM</div>
  </div>

  <!-- CENTER -->
  <div class="center">

    <div class="page active" id="dashboard">DASHBOARD ONLINE</div>
    <div class="page" id="profile">USER PROFILE</div>
    <div class="page" id="system">SYSTEM STATUS</div>

  </div>

  <!-- RIGHT -->
  <div class="panel">
    <div class="card">CPU<div class="bar"><div class="fill" id="cpu"></div></div></div>
    <div class="card">RAM<div class="bar"><div class="fill" id="ram"></div></div></div>
    <div class="card">NET<div class="bar"><div class="fill" id="net"></div></div></div>
  </div>

</div>

<!-- VISUALIZER -->
<div class="visualizer" id="vis"></div>

<!-- MUSIC -->
<audio id="bgm" loop>
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<div class="music">
  <button onclick="toggleMusic()">▶ / ⏸</button><br>
  <input type="range" id="vol" min="0" max="1" step="0.01">
</div>

<script>

/* PAGE SWITCH */
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* CLICK SOUND */
let ctx;
function clickFX(){
  if(!ctx) ctx = new AudioContext();
  if(ctx.state==="suspended") ctx.resume();

  let o = ctx.createOscillator();
  let g = ctx.createGain();

  o.type="square";
  o.frequency.value=800;

  g.gain.setValueAtTime(0.05,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.08);

  o.connect(g);
  g.connect(ctx.destination);

  o.start();
  o.stop(ctx.currentTime+0.08);
}

/* STATS */
function r(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
setInterval(()=>{
  cpu.style.width=r(10,95)+"%";
  ram.style.width=r(10,90)+"%";
  net.style.width=r(5,100)+"%";
},1000);

/* MUSIC + VISUALIZER */
const audio=document.getElementById("bgm");
const vol=document.getElementById("vol");

let ac,an,src;
const vis=document.getElementById("vis");
let bars=[];

/* create bars */
for(let i=0;i<40;i++){
  let b=document.createElement("div");
  b.className="vbar";
  vis.appendChild(b);
  bars.push(b);
}

function initAudio(){
  if(!ac){
    ac=new AudioContext();
    an=ac.createAnalyser();
    src=ac.createMediaElementSource(audio);
    src.connect(an);
    an.connect(ac.destination);
    an.fftSize=64;
  }
}

function render(){
  requestAnimationFrame(render);
  if(!an)return;

  let data=new Uint8Array(an.frequencyBinCount);
  an.getByteFrequencyData(data);

  bars.forEach((b,i)=>{
    let v=data[i]/255;
    b.style.height=(v*80)+"px";
  });
}
render();

/* controls */
function toggleMusic(){
  initAudio();
  if(ac.state==="suspended") ac.resume();

  if(audio.paused) audio.play();
  else audio.pause();
}

vol.oninput=()=>audio.volume=vol.value;
audio.volume=0.5;

/* unlock autoplay */
document.addEventListener("click",()=>{
  initAudio();
  audio.play().catch(()=>{});
},{once:true});

</script>

</body>
</html>
